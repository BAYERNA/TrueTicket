server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:trueticket}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${FRONTEND_ORIGIN:http://localhost:3000}
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: [Authorization, Content-Type, X-Requested-With]
            allowCredentials: true
      routes:
        # Core Domain (Kotlin/Spring, Eureka 등록 서비스 → 로드밸런싱 라우팅)
        - id: ticket-service
          uri: lb://ticket-service
          predicates:
            - Path=/api/auth/**,/api/tickets/**,/api/events,/api/events/**,/api/reservations,/api/reservations/**,/api/payments/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                key-resolver: "#{@ipKeyResolver}"

        # /admit은 의도적으로 라우팅하지 않는다 — 관리자/스케줄러가 queue-service를
        # 직접(사설망) 호출해야 하는 내부 전용 액션. 외부에 열리면 누구나 가상대기열을
        # 건너뛸 수 있다.
        - id: queue-service
          uri: lb://queue-service
          predicates:
            - Path=/api/queue/*/join,/api/queue/*/status
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60
                key-resolver: "#{@ipKeyResolver}"

        # queue-service의 Socket.IO 서버는 서블릿 컨테이너와 별개의 Netty 포트에서 뜬다
        # (SocketIOConfig 참고) — Eureka에 등록되는 인스턴스가 아니라서 AI Domain 라우트처럼
        # 고정 호스트로 라우팅한다. Spring Cloud Gateway는 Upgrade 헤더를 감지해 WebSocket
        # 업그레이드도 동일한 라우트로 투명하게 프록시한다.
        - id: queue-socket
          uri: ${QUEUE_SOCKET_URI:http://localhost:9092}
          predicates:
            - Path=/socket.io/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications,/api/notifications/**,/api/reports,/api/reports/**,/api/judgments/**

        # AI Domain (FastAPI, MVP 단계에서는 고정 호스트로 라우팅)
        - id: bot-detection-service
          uri: ${BOT_DETECTION_SERVICE_URI:http://localhost:8091}
          predicates:
            - Path=/api/bot-detection/**

        - id: resale-monitor-service
          uri: ${RESALE_MONITOR_SERVICE_URI:http://localhost:8092}
          predicates:
            - Path=/api/resale-monitor/**

        - id: verification-service
          uri: ${VERIFICATION_SERVICE_URI:http://localhost:8093}
          predicates:
            - Path=/api/verification/**
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
