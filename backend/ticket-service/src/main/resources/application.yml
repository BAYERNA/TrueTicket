server:
  port: 8081

spring:
  application:
    name: ticket-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_service
    username: ticket
    password: ticket
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

bot-detection-service:
  url: ${BOT_DETECTION_SERVICE_URL:http://localhost:8091}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:trueticket}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
  internal-api-key: ${INTERNAL_API_KEY}
  payment-webhook-secret: ${PAYMENT_WEBHOOK_SECRET}

reservation:
  hold-minutes: ${RESERVATION_HOLD_MINUTES:5}
  expiry-scan-ms: ${RESERVATION_EXPIRY_SCAN_MS:30000}

payment:
  mock-enabled: ${PAYMENT_MOCK_ENABLED:false}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      bot-detection-service:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
