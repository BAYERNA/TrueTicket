server:
  port: 8081

spring:
  application:
    name: ticket-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_service
    username: ticket
    password: ticket
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Google 소셜 로그인(부가 로그인 경로) — client-id/secret이 비어있으면(기본값) 실제
  # Google 계정으로는 로그인할 수 없지만, /oauth2/authorization/google 호출 자체는
  # 여전히 Google의 실제 인가 엔드포인트로 리다이렉트를 시도한다(플레이스홀더 값으로).
  # 실제 운영 배포 시 GOOGLE_OAUTH_CLIENT_ID/SECRET을 Google Cloud Console에서 발급받은
  # 값으로 교체해야 한다.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:placeholder-google-client-id}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:placeholder-google-client-secret}
            scope: openid,email,profile

frontend:
  origin: ${FRONTEND_ORIGIN:http://localhost:3000}

bot-detection-service:
  url: ${BOT_DETECTION_SERVICE_URL:http://localhost:8091}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:trueticket}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
  internal-api-key: ${INTERNAL_API_KEY}
  payment-webhook-secret: ${PAYMENT_WEBHOOK_SECRET}

reservation:
  hold-minutes: ${RESERVATION_HOLD_MINUTES:5}
  expiry-scan-ms: ${RESERVATION_EXPIRY_SCAN_MS:30000}

payment:
  mock-enabled: ${PAYMENT_MOCK_ENABLED:false}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      bot-detection-service:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
