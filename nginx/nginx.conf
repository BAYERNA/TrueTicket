worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # HTTP 요청(REST API)과 WebSocket/Socket.IO 업그레이드 요청을 같은 리버스 프록시로
    # 처리한다 — Connection 헤더 값에 따라 Upgrade 여부를 결정해야 두 경우 모두 동작한다.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream gateway {
        # 서비스는 컨테이너가 아니라 호스트에서 직접 실행하는 것이 기본 개발 흐름이다
        # (README 참고) — host.docker.internal로 호스트의 gateway-service(8080)를 가리킨다.
        server host.docker.internal:8080;
    }

    server {
        listen 80;

        client_max_body_size 10m;

        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket/Socket.IO 업그레이드(예: /socket.io/**)를 위해 필요하다.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
