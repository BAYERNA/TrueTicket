name: verification_app
description: "TrueTicket 현장 검표 앱 — QR 스캔과 얼굴 인증으로 입장을 처리한다 (SCR-06)."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^5.2.3
  camera: ^0.11.0+2
  http: ^1.2.2
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
