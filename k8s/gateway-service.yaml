apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: trueticket
  labels:
    app: gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: ghcr.io/trueticket/gateway-service:latest # 실제 레지스트리 이미지로 교체
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: trueticket-config
            - secretRef:
                name: trueticket-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: trueticket
spec:
  # 외부 요청의 단일 진입점 — 실제 배포에서는 Ingress/LoadBalancer 뒤에 둔다.
  type: ClusterIP
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
