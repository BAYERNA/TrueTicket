apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: trueticket
  labels:
    app: ticket-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
        - name: ticket-service
          image: ghcr.io/trueticket/ticket-service:latest # 실제 레지스트리 이미지로 교체
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: trueticket-config
            - secretRef:
                name: trueticket-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: trueticket-secrets
                  key: TICKET_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: trueticket-secrets
                  key: TICKET_DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trueticket-secrets
                  key: TICKET_DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: trueticket
spec:
  selector:
    app: ticket-service
  ports:
    - port: 8081
      targetPort: 8081
