name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Kotlin / Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew compileKotlin compileTestKotlin test --console=plain

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # next build performs its own TypeScript check (and needs .next/types to exist
      # first for the generated PageProps/LayoutProps helpers) — a separate,
      # standalone `tsc --noEmit` run before this fails for exactly that reason.
      - run: npm run build

  ai-services:
    name: AI Domain (Python syntax)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [bot-detection-service, resale-monitor-service, verification-service]
    defaults:
      run:
        working-directory: ai/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile $(find app -name "*.py")
