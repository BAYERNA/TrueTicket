name: trueticket

services:
  # ------------------------------------------------------------------
  # Databases (Database per Service)
  # ------------------------------------------------------------------
  ticket-db:
    image: postgres:16-alpine
    container_name: trueticket-ticket-db
    environment:
      POSTGRES_DB: ticket_service
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
    ports:
      - "5432:5432"
    volumes:
      - ./infra-data/ticket-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-db:
    image: postgres:16-alpine
    container_name: trueticket-notification-db
    environment:
      POSTGRES_DB: notification_service
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "5433:5432"
    volumes:
      - ./infra-data/notification-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot-detection-db:
    image: postgres:16-alpine
    container_name: trueticket-bot-detection-db
    environment:
      POSTGRES_DB: bot_detection_service
      POSTGRES_USER: botdetect
      POSTGRES_PASSWORD: botdetect
    ports:
      - "5434:5432"
    volumes:
      - ./infra-data/bot-detection-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botdetect -d bot_detection_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  resale-monitor-db:
    image: postgres:16-alpine
    container_name: trueticket-resale-monitor-db
    environment:
      POSTGRES_DB: resale_monitor_service
      POSTGRES_USER: resale
      POSTGRES_PASSWORD: resale
    ports:
      - "5435:5432"
    volumes:
      - ./infra-data/resale-monitor-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resale -d resale_monitor_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  verification-db:
    image: postgres:16-alpine
    container_name: trueticket-verification-db
    environment:
      POSTGRES_DB: verification_service
      POSTGRES_USER: verify
      POSTGRES_PASSWORD: verify
    ports:
      - "5436:5432"
    volumes:
      - ./infra-data/verification-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verify -d verification_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  # Shared infra
  # ------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: trueticket-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: trueticket-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - ./infra-data/kafka:/bitnami/kafka

  minio:
    image: minio/minio:latest
    container_name: trueticket-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: trueticket
      MINIO_ROOT_PASSWORD: trueticket123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./infra-data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  # Observability
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: trueticket-prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra-data/prometheus:/prometheus
    ports:
      - "9090:9090"
    # 각 서비스는 컨테이너가 아니라 호스트에서 직접 실행하는 것이 기본 개발 흐름이라
    # (README 참고), host.docker.internal로 호스트에 뜬 서비스를 스크레이프한다.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: trueticket-tempo
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - ./infra-data/tempo:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

  grafana:
    image: grafana/grafana:latest
    container_name: trueticket-grafana
    depends_on:
      - prometheus
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./infra-data/grafana:/var/lib/grafana
    ports:
      - "3001:3000"
